<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100">
  <style>
    @keyframes blink {
      0%, 45%, 55%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.1); }
    }
    .eye {
      transform-origin: center;
      animation: blink 4s infinite;
    }
    .eye-left { animation-delay: 0s; }
    .eye-right { animation-delay: 0.1s; }
  </style>
  <rect width="240" height="100" fill="none"/>
  <g transform="translate(20, 75)" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="50" letter-spacing="8" fill="#1e1b4b">
    <text x="0" y="0">V</text>
    <g transform="translate(42, 0)">
      <text x="0" y="0">I</text>
      <g transform="translate(6, -42)">
        <!-- Left Eye -->
        <g class="eye eye-left" transform="translate(-10, 0)">
          <circle cx="0" cy="0" r="7" fill="#1e1b4b"/>
          <circle cx="-1.5" cy="-1.5" r="2" fill="#ffffff" opacity="0.9"/>
        </g>
        <!-- Right Eye -->
        <g class="eye eye-right" transform="translate(10, 0)">
          <circle cx="0" cy="0" r="7" fill="#1e1b4b"/>
          <circle cx="-1.5" cy="-1.5" r="2" fill="#ffffff" opacity="0.9"/>
        </g>
      </g>
    </g>
    <text x="75" y="0">BB</text>
  </g>
</svg>
