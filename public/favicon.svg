<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @keyframes blink {
      0%, 45%, 55%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.1); }
    }
    .eye {
      transform-origin: center;
      animation: blink 4s infinite;
    }
    .eye-left { animation-delay: 0s; }
    .eye-right { animation-delay: 0.1s; }
  </style>
  <rect width="100" height="100" fill="#059669" rx="20"/>
  <circle cx="50" cy="50" r="42" fill="#1e1b4b"/>
  <!-- V Character -->
  <text x="50" y="82" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="55" text-anchor="middle" fill="#ffffff">V</text>
  <!-- Eyes -->
  <g transform="translate(50, 28)">
    <g class="eye eye-left" transform="translate(-10, 0)">
      <circle cx="0" cy="0" r="8" fill="#ffffff"/>
      <circle cx="-1" cy="-1.5" r="2.5" fill="#1e1b4b" opacity="0.9"/>
    </g>
    <g class="eye eye-right" transform="translate(10, 0)">
      <circle cx="0" cy="0" r="8" fill="#ffffff"/>
      <circle cx="-1" cy="-1.5" r="2.5" fill="#1e1b4b" opacity="0.9"/>
    </g>
  </g>
</svg>
